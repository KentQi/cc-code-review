name: CI

# The badges in README.md and README.en.md point at this exact path, so the
# file name is part of the contract: .github/workflows/ci.yml.
on:
  # No branch filter: the badge is on the default branch, but a gate that only
  # runs on "main" can be red in a branch and still look green upstream.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Hosted runners do not ship the claude CLI, and the smoke suite is
          # fail-closed when the CLI cannot be resolved. Point resolution at the
          # stub the stub-based e2e suites already use: the stdio handshake,
          # tool list and env verdict are still exercised, so the matrix stays
          # green without installing Claude Code or spending credits. Real-CLI
          # behaviour is covered by `npm test` on a developer machine, where
          # CLAUDE_CODE_PATH is unset.
          CLAUDE_CODE_PATH: ${{ github.workspace }}/scripts/stub-claude.mjs
